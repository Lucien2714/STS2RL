[project]
name = "sts2rl"
version = "0.1.0"
description = "Reinforcement learning agents and evaluation tooling for Slay the Spire 2 through STS2MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.5",
    "requests>=2.34.2",
    "tensorboard>=2.18.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
sts2rl-train = "sts2rl.training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
