[project]
name = "sts2rl"
version = "0.1.0"
description = "Reinforcement learning agents and evaluation tooling for Slay the Spire 2 through STS2MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.5",
    "requests>=2.34.2",
    "tensorboard>=2.18.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
sts2rl-train = "sts2rl.training.cli:main"
sts2rl-eval = "sts2rl.training.eval_cli:main"
sts2rl-bc-clean = "sts2rl.offline.clean_cli:main"
sts2rl-bc-train = "sts2rl.training.bc_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# Torch comes from PyPI as a CPU-only build, and this trains against six local
# game clients on a six-core machine: the clients need those cores more than
# the encoder does, so the forward pass belongs on the GPU. The wheels are only
# on PyTorch's own index, and cu130 is the first line that carries sm_120 for
# an RTX 50-series card.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
