[project]
name = "sts2rl"
version = "0.1.0"
description = "Reinforcement learning agents and evaluation tooling for Slay the Spire 2 through STS2MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.5",
    "requests>=2.34.2",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
