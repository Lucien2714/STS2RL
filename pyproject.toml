[project]
name = "sts2rl"
version = "0.1.0"
description = "Reinforcement learning agents and evaluation tooling for Slay the Spire 2 through STS2MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.5",
    "requests>=2.34.2",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sts2rl-train = "sts2rl.training.cli:main"
sts2rl-evaluate = "sts2rl.evaluation.cli:main"
sts2rl-pretrain = "sts2rl.training.pretrain:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative, behavior-neutral baseline: pycodestyle errors, pyflakes, isort.
# E501 (line length) is owned by the formatter, which leaves unsplittable
# strings long. Broader modernization rules (UP, B) can be enabled later.
select = ["E", "F", "I"]
ignore = ["E501"]
