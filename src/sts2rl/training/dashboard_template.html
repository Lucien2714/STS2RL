<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STS2DQN Training</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #657181;
      --line: #d9dee7;
      --blue: #2563eb;
      --green: #159447;
      --red: #dc2626;
      --amber: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 1240px; margin: 0 auto; padding: 24px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.1; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .status, .socket { color: var(--muted); font-size: 14px; }
    .socket.connected { color: var(--green); }
    .socket.disconnected { color: var(--red); }
    .header-actions {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #ffffff;
      border-radius: 6px;
      min-width: 92px;
      height: 36px;
      padding: 0 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.resume {
      border-color: var(--green);
      background: var(--green);
    }
    button:disabled {
      border-color: var(--line);
      background: #e5e9f0;
      color: var(--muted);
      cursor: not-allowed;
    }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(31, 41, 51, 0.05);
    }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric { border-left: 3px solid var(--blue); padding-left: 10px; min-width: 0; }
    .metric strong { display: block; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
    .metric span { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #111827;
      background: #f1f4f8;
      border-radius: 6px;
      padding: 12px;
      max-height: 190px;
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    .q-table { max-height: 300px; overflow: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; }
    .q-table table { font-size: 12px; }
    .q-table th { position: sticky; top: 0; background: var(--panel); }
    .q-table tr.selected { background: #eff6ff; }
    .clients-table td, .clients-table th { text-align: left; }
    .clients-table td:nth-child(n+3), .clients-table th:nth-child(n+3) { text-align: right; }
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 16px;
    }
    .client-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(31, 41, 51, 0.05);
      min-width: 0;
    }
    .client-panel header {
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .client-panel h2 { margin-bottom: 4px; }
    .client-sections {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    svg { width: 100%; height: 220px; display: block; }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    .counts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .count {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding: 7px 0;
      font-size: 14px;
    }
    .count span:first-child { color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      main { padding: 16px; }
      header { display: block; }
      .header-actions {
        align-items: flex-start;
        justify-content: flex-start;
        margin-top: 12px;
      }
      .span-4, .span-6, .span-8 { grid-column: span 12; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .client-grid, .chart-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>STS2DQN Training</h1>
        <div id="status" class="status">Connecting...</div>
      </div>
      <div class="header-actions">
        <div class="controls">
          <button id="pauseButton" type="button" disabled>Pause</button>
        </div>
        <div id="socketStatus" class="socket disconnected">WebSocket disconnected</div>
      </div>
    </header>
    <section class="grid">
      <div id="clients" class="panel span-12"></div>
      <div id="clientPanels" class="span-12 client-grid"></div>
      <div id="episodes" class="panel span-12"></div>
    </section>
  </main>
  <script>
    const wsUrl = __WS_URL__;
    const statusEl = document.getElementById("status");
    const socketStatusEl = document.getElementById("socketStatus");
    const clientsEl = document.getElementById("clients");
    const clientPanelsEl = document.getElementById("clientPanels");
    const episodesEl = document.getElementById("episodes");
    const pauseButton = document.getElementById("pauseButton");
    let reconnectTimer = null;
    let socket = null;
    let latestPaused = false;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function fixed(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "n/a";
      }
      return Number(value).toFixed(digits);
    }

    function metric(label, value) {
      return `<div class="metric"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>`;
    }

    function render(data) {
      latestPaused = Boolean(data.paused);
      statusEl.innerHTML = `${escapeHtml(data.status)} &middot; elapsed ${escapeHtml(data.elapsed)}s &middot; ${escapeHtml(data.timestamp)}`;
      renderPauseButton();
      renderClients(data.client_steps || {});
      renderClientPanels(
        data.client_steps || {},
        data.recent_steps_by_client || groupRecentStepsByClient(data.recent_steps || [])
      );
      renderEpisodes(data.episode_rows || []);
    }

    function groupRecentStepsByClient(rows) {
      return rows.reduce((groups, row) => {
        const clientId = row.client_id || "client";
        if (!groups[clientId]) {
          groups[clientId] = [];
        }
        groups[clientId].push(row);
        return groups;
      }, {});
    }

    function renderClients(clientSteps) {
      const rows = Object.values(clientSteps).sort((a, b) => String(a.client_id || "").localeCompare(String(b.client_id || "")));
      if (!rows.length) {
        clientsEl.innerHTML = '<h2>Clients</h2><div class="empty">Waiting for configured clients...</div>';
        return;
      }
      const body = rows.map(row => `
        <tr>
          <td>${escapeHtml(row.client_id)}</td>
          <td>${escapeHtml(row.base_url)}</td>
          <td>${escapeHtml(row.client_status || "Training")}</td>
          <td>${escapeHtml(row.episode ?? "n/a")}</td>
          <td>${escapeHtml(row.episode_steps ?? "n/a")}</td>
          <td>${escapeHtml(row.floor ?? "n/a")}</td>
          <td>${escapeHtml(row.act ?? "n/a")}</td>
          <td>${fixed(row.episode_reward)}</td>
          <td>${fixed(row.loss, 5)}</td>
          <td>${escapeHtml(row.trained_steps ?? "n/a")}</td>
        </tr>
      `).join("");
      clientsEl.innerHTML = `
        <h2>Clients</h2>
        <table class="clients-table">
          <thead>
            <tr>
              <th>Client</th>
              <th>Base URL</th>
              <th>Status</th>
              <th>Episode</th>
              <th>Step</th>
              <th>Floor</th>
              <th>Act</th>
              <th>Reward</th>
              <th>Loss</th>
              <th>Trained</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function renderClientPanels(clientSteps, recentStepsByClient) {
      const rows = Object.values(clientSteps).sort((a, b) => String(a.client_id || "").localeCompare(String(b.client_id || "")));
      if (!rows.length) {
        clientPanelsEl.innerHTML = '<div class="client-panel"><h2>Client Details</h2><div class="empty">Waiting for client data...</div></div>';
        return;
      }

      clientPanelsEl.innerHTML = rows.map(client => {
        const clientId = client.client_id || "client";
        const steps = recentStepsByClient[clientId] || [];
        const lossSteps = steps.filter(row => row.loss !== null);
        return `
          <article class="client-panel">
            <header>
              <div>
                <h2>${escapeHtml(clientId)}</h2>
                <div class="status">${escapeHtml(client.client_status || "Training")} &middot; ${escapeHtml(client.base_url || "")}</div>
              </div>
            </header>
            <div class="client-sections">
              ${renderCurrentContent(client)}
              ${renderAgentContent(client)}
              <div class="chart-grid">
                <div>${chartMarkup(steps, "episode_reward", "Episode Reward", "#2563eb")}</div>
                <div>${chartMarkup(lossSteps, "loss", "Training Loss", "#b7791f")}</div>
              </div>
              ${renderActionsContent(client.action_counts || {})}
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCurrentContent(current) {
      if (!current.episode_steps) {
        return '<section><h2>Current Step</h2><div class="empty">Waiting for training data...</div></section>';
      }
      return `
        <section>
          <h2>Current Step</h2>
          <div class="metrics">
            ${metric("Episode", current.episode)}
            ${metric("Step", current.episode_steps)}
            ${metric("Floor", current.floor)}
            ${metric("Act", current.act)}
            ${metric("Reward", fixed(current.reward))}
            ${metric("Episode reward", fixed(current.episode_reward))}
            ${metric("Battle reward", fixed(current.battle_reward))}
            ${metric("Loss", fixed(current.loss, 5))}
            ${metric("Selection", actionSelectionLabel(current.action_selection))}
            ${metric("Selected Q", fixed((current.action_selection || {}).q, 6))}
            ${metric("Epsilon", fixed(current.epsilon, 4))}
            ${metric("Replay", current.replay_size)}
          </div>
          <p class="status">
            ${escapeHtml(current.from_state)} &rarr; ${escapeHtml(current.to_state)}
            &middot; current battle reward=${fixed(current.current_battle_reward)}
            &middot; battle steps=${escapeHtml(current.current_battle_steps)}
            &middot; reason=${escapeHtml((current.action_selection || {}).reason || "n/a")}
          </p>
          <pre>${escapeHtml(JSON.stringify(current.action || {}, null, 2))}</pre>
          ${renderQValues(current.q_values || {})}
        </section>
      `;
    }

    function renderAgentContent(current) {
      if (!current.episode_steps) {
        return '<section><h2>Agent</h2><div class="empty">Waiting for training data...</div></section>';
      }
      return `
        <section>
          <h2>Agent</h2>
          <div class="metrics">
            ${metric("Epsilon", fixed(current.epsilon, 4))}
            ${metric("Replay", current.replay_size)}
            ${metric("Trained", current.trained_steps)}
            ${metric("Learned", current.learn_steps)}
            ${metric("Updates", current.update_count)}
            ${metric("Battle steps", current.battle_steps)}
            ${metric("Wins", current.battle_wins)}
            ${metric("Losses", current.battle_losses)}
          </div>
        </section>
      `;
    }

    function renderActionsContent(actionCounts) {
      const entries = Object.entries(actionCounts).sort((a, b) => b[1] - a[1]);
      if (!entries.length) {
        return '<section><h2>Actions</h2><div class="empty">No battle actions recorded yet.</div></section>';
      }
      return `
        <section>
          <h2>Action Candidates</h2>
          <div class="counts">
            ${entries.map(([key, value]) => `<div class="count"><span>${escapeHtml(key)}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}
          </div>
        </section>
      `;
    }

    function renderPauseButton() {
      pauseButton.textContent = latestPaused ? "Resume" : "Pause";
      pauseButton.className = latestPaused ? "resume" : "";
      pauseButton.setAttribute("aria-pressed", String(latestPaused));
    }

    function sendCommand(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }
      socket.send(JSON.stringify(message));
    }

    function actionSelectionLabel(selection) {
      selection = selection || {};
      if (!selection.method) {
        return "n/a";
      }
      if (selection.method === "epsilon_random") {
        return "epsilon random";
      }
      if (selection.method === "greedy_q") {
        return "greedy Q";
      }
      return selection.method;
    }

    function renderQValues(qValues) {
      if (!qValues.available) {
        return `
          <h2 style="margin-top: 16px;">Current Q Values</h2>
          <div class="empty">${escapeHtml(qValues.reason || "Q values unavailable for this state.")}</div>
        `;
      }
      const best = qValues.best_valid_action;
      const bestText = best ? `${best.key} (${fixed(best.q, 4)})` : "none";
      const validActions = (qValues.actions || []).filter(action => action.valid);
      const rows = validActions.map(action => `
        <tr class="${action.selected ? "selected" : ""}">
          <td>${escapeHtml(action.key)}</td>
          <td>${action.q === null ? "n/a" : fixed(action.q, 6)}</td>
          <td>${escapeHtml(action.selected ? "yes" : "")}</td>
        </tr>
      `).join("");
      return `
        <h2 style="margin-top: 16px;">Current Q Values</h2>
        <p class="status">best valid=${escapeHtml(bestText)} &middot; valid actions=${escapeHtml(validActions.length)}</p>
        <div class="q-table">
          <table>
            <thead>
              <tr>
                <th>Candidate</th>
                <th>Q</th>
                <th>Selected</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderEpisodes(rows) {
      if (!rows.length) {
        episodesEl.innerHTML = '<h2>Completed Episodes</h2><div class="empty">Episode summaries will appear after each run.</div>';
        return;
      }
      const body = rows.slice(-20).reverse().map(row => `
        <tr>
          <td>${escapeHtml(row.client_id ?? "")}</td>
          <td>${escapeHtml(row.episode)}</td>
          <td>${escapeHtml(row.final_floor ?? 0)}</td>
          <td>${escapeHtml(row.final_act ?? 0)}</td>
          <td>${escapeHtml(row.final_state_type ?? "")}</td>
          <td>${fixed(row.reward)}</td>
          <td>${fixed(row.battle_reward)}</td>
          <td>${escapeHtml(row.steps)}</td>
          <td>${escapeHtml(row.battle_steps)}</td>
          <td>${escapeHtml(row.updates)}</td>
          <td>${fixed(row.avg_loss, 5)}</td>
          <td>${fixed(row.epsilon_end, 4)}</td>
          <td>${escapeHtml(row.wins)}</td>
          <td>${escapeHtml(row.losses)}</td>
        </tr>
      `).join("");
      episodesEl.innerHTML = `
        <h2>Completed Episodes</h2>
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Episode</th>
              <th>Floor</th>
              <th>Act</th>
              <th>State</th>
              <th>Reward</th>
              <th>Battle</th>
              <th>Steps</th>
              <th>BSteps</th>
              <th>Updates</th>
              <th>Avg loss</th>
              <th>Epsilon</th>
              <th>Wins</th>
              <th>Losses</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function chartMarkup(rows, key, title, color) {
      if (rows.length < 2) {
        return `<h2>${escapeHtml(title)}</h2><div class="empty">Chart starts after two data points.</div>`;
      }
      const values = rows.map(row => Number(row[key] || 0));
      const width = 640;
      const height = 220;
      const padding = 28;
      let minValue = Math.min(...values);
      let maxValue = Math.max(...values);
      if (minValue === maxValue) {
        minValue -= 1;
        maxValue += 1;
      }
      const points = values.map((value, index) => {
        const x = padding + index * (width - padding * 2) / Math.max(1, values.length - 1);
        const y = height - padding - (value - minValue) * (height - padding * 2) / (maxValue - minValue);
        return [x, y];
      });
      const pointString = points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
      return `
        <h2>${escapeHtml(title)}</h2>
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(title)} chart">
          <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#d9dee7" />
          <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="#d9dee7" />
          <text x="${padding}" y="18" fill="#657181" font-size="12">${maxValue.toFixed(2)}</text>
          <text x="${padding}" y="${height - 6}" fill="#657181" font-size="12">${minValue.toFixed(2)}</text>
          <polyline points="${pointString}" fill="none" stroke="${color}" stroke-width="3" />
        </svg>
      `;
    }

    function connect() {
      clearTimeout(reconnectTimer);
      const nextSocket = new WebSocket(wsUrl);
      socket = nextSocket;
      nextSocket.addEventListener("open", () => {
        socketStatusEl.textContent = `WebSocket connected: ${wsUrl}`;
        socketStatusEl.className = "socket connected";
        pauseButton.disabled = false;
      });
      nextSocket.addEventListener("message", event => render(JSON.parse(event.data)));
      nextSocket.addEventListener("close", () => {
        if (socket !== nextSocket) {
          return;
        }
        pauseButton.disabled = true;
        socketStatusEl.textContent = "WebSocket disconnected; reconnecting...";
        socketStatusEl.className = "socket disconnected";
        reconnectTimer = setTimeout(connect, 1000);
      });
      nextSocket.addEventListener("error", () => nextSocket.close());
    }

    pauseButton.addEventListener("click", () => {
      sendCommand({ command: "set_paused", paused: !latestPaused });
    });

    clientsEl.innerHTML = '<h2>Clients</h2><div class="empty">Connecting to trainer...</div>';
    clientPanelsEl.innerHTML = '<div class="client-panel"><h2>Client Details</h2><div class="empty">Connecting to trainer...</div></div>';
    episodesEl.innerHTML = '<h2>Completed Episodes</h2><div class="empty">Connecting to trainer...</div>';
    connect();
  </script>
</body>
</html>
